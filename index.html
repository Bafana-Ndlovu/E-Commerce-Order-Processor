<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Order Processor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    <h1 class="text-3xl font-bold text-center">E-Commerce Order Processor</h1>

    <!-- Orders Section -->
    <section id="orders" class="bg-white shadow rounded p-4">
      <h2 class="text-xl font-semibold mb-2">Orders</h2>
      <div id="orders-list" class="space-y-2"></div>
    </section>

    <!-- Other sections (empty for now) -->
    <section id="search" class="bg-white shadow rounded p-4">
      <h2 class="text-xl font-semibold mb-2">Search / Filter</h2>
    </section>

    <section id="statistics" class="bg-white shadow rounded p-4">
      <h2 class="text-xl font-semibold mb-2">Statistics</h2>
    </section>

    <section id="categories" class="bg-white shadow rounded p-4">
      <h2 class="text-xl font-semibold mb-2">Categories</h2>
    </section>

    <section id="lookup" class="bg-white shadow rounded p-4">
      <h2 class="text-xl font-semibold mb-2">Product Lookup</h2>
    </section>

    <section id="processing" class="bg-white shadow rounded p-4">
      <h2 class="text-xl font-semibold mb-2">Data Processing</h2>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
